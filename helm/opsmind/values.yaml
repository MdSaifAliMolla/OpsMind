image:
  repository: ghcr.io/mdsaifalimolla/opsmind-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false
  className: alb
  host: opsmind.example.com
  annotations: {}
  tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

env:
  OPSMIND_APPROVAL_TTL_MIN: "60"
  OPSMIND_RATE_LIMIT_PER_MIN: "60"
  QDRANT_URL: http://opsmind-qdrant:6333
  GEMINI_MODEL: gemini-3.5-flash-lite
  HF_HUB_OFFLINE: "0"
  OPSMIND_NAMESPACE: opsmind
  OPSMIND_EXECUTE: "true"
  PROMETHEUS_URL: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
  LOKI_URL: http://loki.logging:3100
  JAEGER_URL: http://jaeger.logging:16686
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.logging:4317

secrets:
  DATABASE_URL: ""
  GOOGLE_API_KEY: ""
  OPSMIND_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

postgresql:
  enabled: false

qdrant:
  enabled: true
  image:
    tag: v1.11.0

demo:
  enabled: false
  replicaCount: 1
  port: 8002

serviceMonitor:
  enabled: true
  interval: 15s

podDisruptionBudget:
  enabled: true
  minAvailable: 1
