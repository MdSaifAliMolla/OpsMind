apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsmind.fullname" . }}-api
  labels: {{ include "opsmind.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: {{ include "opsmind.fullname" . }}-api }
  template:
    metadata:
      labels: { app: {{ include "opsmind.fullname" . }}-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "opsmind.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 4000 }]
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          envFrom:
            - configMapRef: { name: {{ include "opsmind.fullname" . }}-config }
            - secretRef: { name: {{ include "opsmind.fullname" . }}-secrets, optional: false }
            - secretRef: { name: opsmind-secrets, optional: false }
          env:
            - name: DATABASE_URL
              value: "postgresql://opsmind:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/opsmind"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{ .Values.resources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsmind.fullname" . }}-api
  labels: {{ include "opsmind.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: { app: {{ include "opsmind.fullname" . }}-api }
  ports: [{ port: {{ .Values.service.port }}, targetPort: 4000 }]
