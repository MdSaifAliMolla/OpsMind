{{- if .Values.demo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsmind.fullname" . }}-demo
  labels: {{ include "opsmind.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.demo.replicaCount }}
  selector:
    matchLabels: { app: {{ include "opsmind.fullname" . }}-demo }
  template:
    metadata:
      labels: { app: {{ include "opsmind.fullname" . }}-demo }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["uvicorn", "app.demo.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports: [{ containerPort: 8002 }]
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsmind.fullname" . }}-demo
spec:
  selector: { app: {{ include "opsmind.fullname" . }}-demo }
  ports: [{ port: 8002, targetPort: 8002 }]
{{- end }}
