{{- if not .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmind-postgresql
  labels: {{ include "opsmind.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsmind-postgresql }
  template:
    metadata:
      labels: { app: opsmind-postgresql }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: opsmind }
            - { name: POSTGRES_PASSWORD, value: opsmind }
            - { name: POSTGRES_DB, value: opsmind }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "opmind"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "opmind"] }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opsmind-postgresql
  labels: {{ include "opsmind.labels" . | nindent 4 }}
spec:
  selector: { app: opsmind-postgresql }
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
