apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsmind.fullname" . }}
  labels: {{ include "opsmind.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsmind.fullname" . }}-config
  labels: {{ include "opsmind.labels" . | nindent 4 }}
data:
  QDRANT_URL: {{ .Values.env.QDRANT_URL | quote }}
  GEMINI_MODEL: {{ .Values.env.GEMINI_MODEL | quote }}
  HF_HUB_OFFLINE: {{ .Values.env.HF_HUB_OFFLINE | quote }}
  OPSMIND_NAMESPACE: {{ .Values.env.OPSMIND_NAMESPACE | quote }}
  OPSMIND_EXECUTE: {{ .Values.env.OPSMIND_EXECUTE | quote }}
  PROMETHEUS_URL: {{ .Values.env.PROMETHEUS_URL | quote }}
  LOKI_URL: {{ .Values.env.LOKI_URL | quote }}
  JAEGER_URL: {{ .Values.env.JAEGER_URL | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsmind.fullname" . }}-secrets
  labels: {{ include "opsmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required" .Values.secrets.DATABASE_URL | quote }}
  GOOGLE_API_KEY: {{ required "secrets.GOOGLE_API_KEY is required" .Values.secrets.GOOGLE_API_KEY | quote }}
  OPSMIND_API_KEY: {{ required "secrets.OPSMIND_API_KEY is required" .Values.secrets.OPSMIND_API_KEY | quote }}
  LANGFUSE_PUBLIC_KEY: {{ required "secrets.LANGFUSE_PUBLIC_KEY is required" .Values.secrets.LANGFUSE_PUBLIC_KEY | quote }}
  LANGFUSE_SECRET_KEY: {{ required "secrets.LANGFUSE_SECRET_KEY is required" .Values.secrets.LANGFUSE_SECRET_KEY | quote }}
