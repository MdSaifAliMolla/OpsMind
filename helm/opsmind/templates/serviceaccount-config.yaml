apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsmind.fullname" . }}
  labels: {{ include "opsmind.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsmind.fullname" . }}-config
  labels: {{ include "opsmind.labels" . | nindent 4 }}
data:
  OPSMIND_CHECKPOINTER: {{ .Values.env.OPSMIND_CHECKPOINTER | quote }}
  QDRANT_URL: {{ .Values.env.QDRANT_URL | quote }}
  GEMINI_MODEL: {{ .Values.env.GEMINI_MODEL | quote }}
  HF_HUB_OFFLINE: {{ .Values.env.HF_HUB_OFFLINE | quote }}
  OPSMIND_NAMESPACE: {{ .Values.env.OPSMIND_NAMESPACE | quote }}
  OPSMIND_EXECUTE: {{ .Values.env.OPSMIND_EXECUTE | quote }}
---
{{- if or .Values.secrets.DATABASE_URL .Values.secrets.GOOGLE_API_KEY .Values.secrets.OPSMIND_API_KEY .Values.secrets.LANGFUSE_PUBLIC_KEY .Values.secrets.LANGFUSE_SECRET_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsmind.fullname" . }}-secrets
  labels: {{ include "opsmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.DATABASE_URL }}DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}{{ end }}
  {{- if .Values.secrets.GOOGLE_API_KEY }}GOOGLE_API_KEY: {{ .Values.secrets.GOOGLE_API_KEY | quote }}{{ end }}
  {{- if .Values.secrets.OPSMIND_API_KEY }}OPSMIND_API_KEY: {{ .Values.secrets.OPSMIND_API_KEY | quote }}{{ end }}
  {{- if .Values.secrets.LANGFUSE_PUBLIC_KEY }}LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.LANGFUSE_PUBLIC_KEY | quote }}{{ end }}
  {{- if .Values.secrets.LANGFUSE_SECRET_KEY }}LANGFUSE_SECRET_KEY: {{ .Values.secrets.LANGFUSE_SECRET_KEY | quote }}{{ end }}
{{- end }}
