apiVersion: v2
name: opsmind
description: OpsMind — autonomous incident-response agent (FastAPI + LangGraph + RAG + XGBoost)
type: application
version: 0.2.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "15.5.8"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: qdrant
    version: "0.9.1"
    repository: https://qdrant.github.io/qdrant-helm
    condition: qdrant.enabled
