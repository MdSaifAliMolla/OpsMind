services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind
      POSTGRES_DB: opsmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlartifacts

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus.rules.yml:/etc/prometheus/rules.yml

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/dashboards

  demo:
    build: .
    command: uvicorn app.demo.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://opsmind:opsmind@postgres:5432/opsmind
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - postgres
      - qdrant

volumes:
  pgdata:
  qdrantdata:
  mlflowdata:
