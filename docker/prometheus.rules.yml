groups:
  - name: opsmind-agent
    interval: 30s
    rules:
      - alert: OpsMindFailures
        expr: opsmind_incidents_failed_total > 0
        for: 1m
        labels: { severity: P1, service: opsmind-api, namespace: opsmind }
        annotations:
          summary: "OpsMind investigations are failing"

      - alert: OpsMindLowSuccessRate
        expr: opsmind_agent_success_rate < 0.7
        for: 5m
        labels: { severity: P3, service: opsmind-api, namespace: opsmind }
        annotations:
          summary: "Agent success rate below 70%"

      - alert: OpsMindEvalRegression
        expr: opsmind_eval_rca_accuracy < 0.6 or opsmind_eval_severity_accuracy < 0.7
        for: 5m
        labels: { severity: P3, service: opsmind-api, namespace: opsmind }
        annotations:
          summary: "Gated eval regressed (need 70% severity / 60% RCA)"

      - alert: OpsMindLLMErrors
        expr: rate(opsmind_llm_errors_total[5m]) > 0.05
        for: 5m
        labels: { severity: P3, service: opsmind-api, namespace: opsmind }
        annotations:
          summary: "LLM error rate elevated"

  - name: demo-service
    interval: 15s
    rules:
      - alert: DemoFastBurn
        expr: rate(demo_checkouts_total{status="error"}[2m]) / rate(demo_checkouts_total[2m]) > 0.25
        for: 2m
        labels: { severity: P1, service: demo-checkout, namespace: default }
        annotations:
          summary: "demo-checkout fast burn: errors above 25% for 2m"

      - alert: DemoSlowBurn
        expr: rate(demo_checkouts_total{status="error"}[10m]) / rate(demo_checkouts_total[10m]) > 0.1
        for: 15m
        labels: { severity: P2, service: demo-checkout, namespace: default }
        annotations:
          summary: "demo-checkout slow burn: errors above 10% for 15m"
