global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "opsmind-api"
    static_configs:
      - targets: ["api:4000"]

  - job_name: "demo-checkout"
    static_configs:
      - targets: ["demo:8002"]
