name: ci-cd
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mdsaifalimolla/opsmind-api

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U opsmind" --health-interval=5s
          --health-timeout=5s --health-retries=5
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app data scripts tests
      - run: python -m pytest -q
      - run: python data/generate_incidents.py --n 40
      - run: python -m app.ml.family
        env: { MLFLOW_TRACKING_URI: "" }
      - run: python -m app.rag.ingest
        env:
          QDRANT_URL: http://localhost:6333
          DATABASE_URL: postgres://opsmind:opsmind@localhost:5432/opsmind
      - run: python -m app.evaluation.run --help
      - name: Gated eval (main only, needs GOOGLE_API_KEY)
        if: github.ref == 'refs/heads/main'
        run: python -m app.evaluation.run
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: postgres://opsmind:opsmind@localhost:5432/opsmind
      - name: Eval report (main only)
        if: github.ref == 'refs/heads/main'
        run: python -m app.evaluation.report --results app/evaluation/results.json --out docs/eval/REPORT.md

  build-push:
    needs: lint-test-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/opsmind
      - run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          helm template opsmind helm/opsmind --set image.repository=${{ env.IMAGE }} --set image.tag=${{ github.sha }} | ./kubeconform -summary -ignore-missing-schemas

  stamp-image:
    if: github.ref == 'refs/heads/main'
    needs: [build-push, helm-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" helm/opsmind/values.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/opsmind/values.yaml
          git commit -m "chore: GitOps sync to image tag ${{ github.sha }}" || echo "No changes to commit"
          git push
