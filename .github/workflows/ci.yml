name: CI
on: [push, pull_request]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U opsmind"
          --health-interval=5s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      - run: pytest

      - name: Generate incidents
        run: python data/generate_incidents.py --n 40

      - name: Train severity model
        run: python -m app.ml.train
        env:
          MLFLOW_TRACKING_URI: ""

      - name: Ingest runbooks
        run: python -m app.rag.ingest

      - name: Evaluation gate
        run: python -m app.evaluation.run

      - name: Docker build
        run: docker build -t opsmind-api:ci .
