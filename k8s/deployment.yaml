apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmind-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: opsmind-api }
  template:
    metadata:
      labels: { app: opsmind-api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: opsmind-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: opsmind-secrets, key: DATABASE_URL, optional: false }
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef: { name: opsmind-secrets, key: GOOGLE_API_KEY, optional: false }
            - name: QDRANT_URL
              value: http://opsmind-qdrant:6333
            - name: PROMETHEUS_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
            - name: LOKI_URL
              value: http://loki.logging:3100
            - name: JAEGER_URL
              value: http://jaeger.logging:16686
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.logging:4317
            - name: OPSMIND_NAMESPACE
              value: opsmind
            - name: OPSMIND_EXECUTE
              value: "true"
            - name: GEMINI_MODEL
              value: gemini-3.5-flash-lite
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: opsmind-api
spec:
  selector: { app: opsmind-api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opsmind-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: opsmind-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
