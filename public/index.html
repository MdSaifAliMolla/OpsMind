<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpsMind — incidents</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <h1>OpsMind <span>/ incidents</span></h1>
  <div class="health"><span id="healthDot" class="dot"></span><span id="healthText">connecting…</span></div>
</header>
<p class="lede">Triage &rarr; investigate &rarr; propose fix. Medium/high-risk actions pause here for a human decision.</p>

<div class="card">
  <h3>Agent vitals <span class="muted" style="font-weight:400">— live from <span class="mono">/metrics</span>, same numbers Grafana charts</span></h3>
  <div id="metricsStrip" class="metrics"><p class="muted">loading…</p></div>
  <canvas id="costSpark" width="600" height="44" style="width:100%;height:44px;margin-top:0.6rem"></canvas>
</div>

<div class="card toolbar">
  <button id="refreshBtn" class="ghost">Refresh</button>
  <span id="fireStatus" class="muted" style="margin-left:0.6rem"></span>
</div>

<div class="row">
  <div class="col narrow"><div id="list"></div></div>
  <div class="col"><div id="detail"><p class="muted">Pick an incident to see the agent's trace, hypotheses and the proposed fix.</p></div></div>
</div>

<script src="app.js"></script>
</body>
</html>
